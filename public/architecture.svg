<?xml version="1.0" encoding="UTF-8"?>
<svg width="1240" height="850" viewBox="0 0 1240 850" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:Menlo,'SF Mono',monospace}</style><rect x="0" y="0" width="1240" height="850" fill="#f1eee4"/>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#161410" />
          </marker>
          <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1f3bff" />
          </marker>
        </defs>

        <!-- Header -->
        <text x="40" y="50" font-size="34" font-weight="800" fill="#161410">DropZero</text>
        <text x="40" y="76" class="mono" font-size="14" fill="#5c584c" letter-spacing="0.06em">
          OVERSELL-PROOF GLOBAL LIVE-DROPS · SYSTEM ARCHITECTURE
        </text>
        <text x="1200" y="50" text-anchor="end" class="mono" font-size="13" fill="#1f3bff">Aurora DSQL × Vercel</text>
        <text x="1200" y="72" text-anchor="end" class="mono" font-size="12" fill="#5c584c">Track 3 · Million-scale</text>

        <!-- ============ Zone A: Buyers ============ -->
        <rect x="40" y="190" width="180" height="120" rx="6" fill="#fbfaf4" stroke="#161410" stroke-width="1.5" />
        <text x="130" y="222" text-anchor="middle" class="mono" font-size="13" fill="#1f3bff" font-weight="700">BUYERS</text>
        <text x="130" y="246" text-anchor="middle" font-size="13" fill="#161410">worldwide</text>
        <text x="130" y="270" text-anchor="middle" class="mono" font-size="11" fill="#5c584c">browser · React</text>
        <text x="130" y="288" text-anchor="middle" class="mono" font-size="11" fill="#5c584c">SWR live polling</text>

        <!-- A -> B -->
        <line x1="222" y1="250" x2="266" y2="250" stroke="#161410" stroke-width="1.6" marker-end="url(#arrow)" />
        <text x="244" y="241" text-anchor="middle" class="mono" font-size="10" fill="#5c584c">HTTPS</text>

        <!-- ============ Zone B: Vercel ============ -->
        <rect x="270" y="150" width="420" height="500" rx="10" fill="none" stroke="#1f3bff" stroke-width="1.4" stroke-dasharray="6 6" />
        <text x="292" y="176" class="mono" font-size="13" fill="#1f3bff" font-weight="700">▲ VERCEL · arn1 (Stockholm)</text>

        <!-- B1 client -->
        <rect x="300" y="196" width="360" height="92" rx="6" fill="#fbfaf4" stroke="#161410" stroke-width="1.5" />
        <text x="316" y="222" font-size="15" font-weight="700" fill="#161410">Next.js Client</text>
        <text x="316" y="246" class="mono" font-size="11" fill="#5c584c">React · Tailwind · SWR (~1.2s)</text>
        <text x="316" y="266" class="mono" font-size="11" fill="#5c584c">home · drop detail · seller · live tape</text>

        <line x1="480" y1="288" x2="480" y2="312" stroke="#161410" stroke-width="1.6" marker-end="url(#arrow)" />
        <text x="492" y="305" class="mono" font-size="10" fill="#5c584c">fetch JSON</text>

        <!-- B2 api -->
        <rect x="300" y="312" width="360" height="104" rx="6" fill="#fbfaf4" stroke="#161410" stroke-width="1.5" />
        <text x="316" y="338" font-size="15" font-weight="700" fill="#161410">API Route Handlers</text>
        <text x="316" y="360" class="mono" font-size="11" fill="#5c584c">Node runtime (server-only)</text>
        <text x="316" y="380" class="mono" font-size="11" fill="#5c584c">/drops · /reserve · /simulate</text>
        <text x="316" y="398" class="mono" font-size="11" fill="#5c584c">/checkout · /feed · /stats</text>

        <line x1="480" y1="416" x2="480" y2="446" stroke="#161410" stroke-width="1.6" marker-end="url(#arrow)" />

        <!-- B3 engine -->
        <rect x="300" y="446" width="360" height="146" rx="6" fill="#fbfaf4" stroke="#1f3bff" stroke-width="2" />
        <text x="316" y="472" font-size="15" font-weight="700" fill="#161410">Data layer — claim engine</text>
        <text x="316" y="496" class="mono" font-size="11.5" fill="#161410">reserve(): claim a random distinct unit</text>
        <text x="316" y="516" class="mono" font-size="11.5" fill="#161410">withRetry() on OCC 40001 (jittered)</text>
        <text x="316" y="536" class="mono" font-size="11.5" fill="#161410">idempotency-key dedupe</text>
        <text x="316" y="562" class="mono" font-size="11" fill="#5c584c">pg driver + @aws-sdk/dsql-signer</text>
        <text x="316" y="580" class="mono" font-size="11" fill="#5c584c">DsqlSigner → IAM auth token / connection</text>

        <!-- B -> C -->
        <path d="M660,500 C 715,500 720,300 786,278" fill="none" stroke="#1f3bff" stroke-width="2" marker-end="url(#arrowC)" />
        <path d="M786,300 C 720,322 715,520 660,520" fill="none" stroke="#1f3bff" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrowC)" />
        <rect x="697" y="424" width="56" height="30" rx="4" fill="#f1eee4" />
        <text x="725" y="438" text-anchor="middle" class="mono" font-size="9.5" fill="#1f3bff">IAM · TLS</text>
        <text x="725" y="450" text-anchor="middle" class="mono" font-size="9.5" fill="#1f3bff">strong SQL</text>

        <!-- ============ Zone C: AWS ============ -->
        <rect x="760" y="150" width="440" height="500" rx="10" fill="none" stroke="#161410" stroke-width="1.4" stroke-dasharray="6 6" />
        <text x="782" y="176" class="mono" font-size="13" fill="#161410" font-weight="700">☁ AWS · eu-north-1 (Stockholm)</text>

        <!-- DSQL -->
        <rect x="790" y="196" width="390" height="150" rx="6" fill="#161410" stroke="#161410" />
        <text x="808" y="226" font-size="17" font-weight="800" fill="#f1eee4">Amazon Aurora DSQL</text>
        <text x="808" y="252" class="mono" font-size="11.5" fill="rgba(241,238,228,0.7)">serverless · PostgreSQL-compatible</text>
        <text x="808" y="272" class="mono" font-size="11.5" fill="rgba(241,238,228,0.7)">replicated across 3 Availability Zones</text>
        <text x="808" y="292" class="mono" font-size="11.5" fill="rgba(241,238,228,0.7)">strongly consistent · optimistic concurrency</text>
        <text x="808" y="312" class="mono" font-size="11.5" fill="rgba(241,238,228,0.7)">scales to zero · no servers to manage</text>
        <text x="808" y="333" class="mono" font-size="11" fill="#7fa0ff">— system of record —</text>

        <!-- tables -->
        <rect x="790" y="362" width="390" height="50" rx="5" fill="#fbfaf4" stroke="#161410" stroke-width="1.3" />
        <text x="808" y="383" class="mono" font-size="13" font-weight="700" fill="#161410">drops</text>
        <text x="808" y="401" class="mono" font-size="10.5" fill="#5c584c">name · total · price · status</text>

        <rect x="790" y="420" width="390" height="50" rx="5" fill="#fbfaf4" stroke="#1f3bff" stroke-width="1.6" />
        <text x="808" y="441" class="mono" font-size="13" font-weight="700" fill="#161410">drop_units — one row per unit</text>
        <text x="808" y="459" class="mono" font-size="10.5" fill="#5c584c">status: available | claimed (claimed once → 0 oversell)</text>

        <rect x="790" y="478" width="390" height="50" rx="5" fill="#fbfaf4" stroke="#161410" stroke-width="1.3" />
        <text x="808" y="499" class="mono" font-size="13" font-weight="700" fill="#161410">orders</text>
        <text x="808" y="517" class="mono" font-size="10.5" fill="#5c584c">idempotency_key UNIQUE · region · qty</text>

        <text x="985" y="556" text-anchor="middle" class="mono" font-size="10.5" fill="#5c584c">Auth: IAM (DsqlSigner mints a short-lived token per connection)</text>

        <!-- ============ Callout banner ============ -->
        <rect x="40" y="680" width="1160" height="64" rx="8" fill="rgba(31,59,255,0.06)" stroke="#1f3bff" stroke-width="1.5" />
        <text x="60" y="708" class="mono" font-size="12.5" fill="#161410">
          THE DESIGN — inventory is N discrete rows, not a hot counter. Each buyer atomically claims a <tspan font-weight="700">random distinct</tspan> row in one
        </text>
        <text x="60" y="728" class="mono" font-size="12.5" fill="#161410">
          strongly-consistent DSQL transaction → <tspan fill="#0e7a4b" font-weight="700">provably 0 oversell</tspan>, and writes spread across the key range → <tspan fill="#0e7a4b" font-weight="700">near-0 OCC contention</tspan>.
        </text>

        <!-- ============ Planned strip ============ -->
        <rect x="40" y="762" width="1160" height="60" rx="8" fill="none" stroke="#5c584c" stroke-width="1.2" stroke-dasharray="5 5" />
        <text x="60" y="787" class="mono" font-size="11.5" fill="#5c584c" font-weight="700">PLANNED · WELL-ARCHITECTED EXTENSIONS</text>
        <text x="60" y="807" class="mono" font-size="11.5" fill="#5c584c">
          DynamoDB feed fan-out (extreme write volume) · Stripe payments (test-mode wired) · CloudWatch DPU &amp; conflict metrics · 2nd-region active-active
        </text>
      </svg>