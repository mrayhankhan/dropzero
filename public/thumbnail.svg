<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:Menlo,'SF Mono',monospace}</style>
